    <style>
      html { font-size: 16px; scroll-behavior: smooth; }
      /* The app header is 4rem tall, so it shrinks with the root font size on a
         laptop. Full-height panes subtract this rather than a fixed 64px, or
         they would leave a strip of dead space under themselves. */
      :root { --app-header-h: 4rem; }

      /*
        Laptop screens: shrink, do not reflow.

        Tailwind sizes spacing and type in rem, so stepping the root font size
        scales the whole desktop interface at once — a 1280-wide laptop gets the
        same layout a 1600-wide one does, just smaller, instead of the header
        wrapping onto a second line and cards spilling below the fold.

        Scoped to the width where the app already switches to its desktop
        layout (Tailwind's `lg`), so phones and tablets keep the layouts built
        for them. Deliberately not gated on `pointer: fine`: a touchscreen
        laptop reports a coarse primary pointer and would have been left out.
      */
      @media (min-width: 1024px) {
        html { font-size: 13px; }
      }
      @media (min-width: 1152px) {
        html { font-size: 13.5px; }
      }
