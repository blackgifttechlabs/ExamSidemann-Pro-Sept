const grid = document.getElementById('grid'), empty = document.getElementById('empty');
const fmt = s => { const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=Math.floor(s%60);
  return h ? h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0') : m+':'+String(x).padStart(2,'0'); };
const subs = [...new Set(VIDEOS.map(v=>v.s))].sort();
const subSel = document.getElementById('subject');
subs.forEach(s => { const o=document.createElement('option'); o.textContent=s; subSel.appendChild(o); });

function render() {
  const g = document.getElementById('grade').value;
  const s = subSel.value;
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = VIDEOS.filter(v =>
    (!g || v.g.includes(g)) && (!s || v.s === s) &&
    (!q || (v.t+' '+v.c).toLowerCase().includes(q)));
  document.getElementById('count').textContent =
    list.length + ' of ' + VIDEOS.length + ' videos - click any to play';
  empty.hidden = list.length > 0;
  grid.innerHTML = list.map(v => `<div class="card" data-id="${v.i}" data-t="${v.t.replace(/"/g,'&quot;')}" data-c="${v.c.replace(/"/g,'&quot;')}">
    <div class="thumb"><img loading="lazy" src="https://img.youtube.com/vi/${v.i}/hqdefault.jpg" alt="">
    <span class="dur">${fmt(v.d)}</span></div>
    <div class="meta"><div class="title">${v.t}</div>
    <div class="tags"><span class="tag">${v.s}</span>${v.g.map(x=>'<span class="tag alt">'+x+'</span>').join('')}</div>
    <div class="chan">${v.c}</div></div></div>`).join('');
}
const dlg = document.getElementById('dlg'), frame = document.getElementById('frame');
grid.addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  frame.src = 'https://www.youtube.com/embed/' + card.dataset.id + '?autoplay=1&rel=0';
  document.getElementById('dTitle').textContent = card.dataset.t;
  document.getElementById('dChan').textContent = card.dataset.c;
  dlg.showModal();
});
const shut = () => { frame.src = ''; dlg.close(); };
document.getElementById('closeBtn').onclick = shut;
dlg.addEventListener('click', e => { if (e.target === dlg) shut(); });
dlg.addEventListener('close', () => { frame.src = ''; });
['grade','subject','q'].forEach(id => document.getElementById(id).addEventListener('input', render));
render();
</script></body></html>
