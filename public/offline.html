<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BXQF9X9T0Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-BXQF9X9T0Y');
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071827" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Offline | Exam Sidemann</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Plus Jakarta Sans", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #eaf1f8;
        background:
          radial-gradient(circle at 18% 12%, rgba(249, 115, 22, .14), transparent 28rem),
          radial-gradient(circle at 88% 82%, rgba(37, 99, 235, .16), transparent 28rem),
          #071827;
      }
      main {
        width: min(470px, 100%);
        padding: 30px;
        text-align: center;
        background: rgba(10, 31, 49, .84);
        border: 1px solid rgba(148, 163, 184, .2);
        border-radius: 24px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, .32);
      }
      img {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, .32);
      }
      p.brand {
        margin: 18px 0 7px;
        color: #fb923c;
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .1em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 5vw, 2.1rem);
        line-height: 1.2;
      }
      p.message {
        margin: 12px auto 0;
        max-width: 36ch;
        color: #b9c7d5;
        font-size: .93rem;
        line-height: 1.65;
      }
      button {
        margin-top: 22px;
        padding: 11px 18px;
        color: #fff;
        background: linear-gradient(135deg, #f97316, #ea580c);
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        font: inherit;
        font-size: .88rem;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon-192.png" width="76" height="76" alt="" />
      <p class="brand">Exam Sidemann</p>
      <h1>You are offline</h1>
      <p class="message">
        Installed lesson resources and previously opened pages remain available.
        Reconnect for sign-in, messages, payments and live AI features.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
