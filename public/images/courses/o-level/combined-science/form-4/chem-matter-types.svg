<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img"><title>Elements, compounds and mixtures</title><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a"><text x="450.0" y="30" text-anchor="middle" font-size="22">Elements, compounds and mixtures</text><text x="150" y="65" text-anchor="middle" font-size="20">Element</text><circle cx="65" cy="110" r="14" fill="#2563eb"/><circle cx="140" cy="110" r="14" fill="#2563eb"/><circle cx="215" cy="110" r="14" fill="#2563eb"/><circle cx="65" cy="175" r="14" fill="#2563eb"/><circle cx="140" cy="175" r="14" fill="#2563eb"/><circle cx="215" cy="175" r="14" fill="#2563eb"/><text x="150" y="245" text-anchor="middle" font-size="14">One type of atom</text><text x="450" y="65" text-anchor="middle" font-size="20">Compound</text><circle cx="365" cy="110" r="14" fill="#2563eb"/><path d="M365 110 L392 110" stroke="#64748b" stroke-width="2" fill="none"/><circle cx="392" cy="110" r="14" fill="#dc2626"/><circle cx="440" cy="110" r="14" fill="#2563eb"/><path d="M440 110 L467 110" stroke="#64748b" stroke-width="2" fill="none"/><circle cx="467" cy="110" r="14" fill="#dc2626"/><circle cx="515" cy="110" r="14" fill="#2563eb"/><path d="M515 110 L542 110" stroke="#64748b" stroke-width="2" fill="none"/><circle cx="542" cy="110" r="14" fill="#dc2626"/><circle cx="365" cy="175" r="14" fill="#2563eb"/><path d="M365 175 L392 175" stroke="#64748b" stroke-width="2" fill="none"/><circle cx="392" cy="175" r="14" fill="#dc2626"/><circle cx="440" cy="175" r="14" fill="#2563eb"/><path d="M440 175 L467 175" stroke="#64748b" stroke-width="2" fill="none"/><circle cx="467" cy="175" r="14" fill="#dc2626"/><circle cx="515" cy="175" r="14" fill="#2563eb"/><path d="M515 175 L542 175" stroke="#64748b" stroke-width="2" fill="none"/><circle cx="542" cy="175" r="14" fill="#dc2626"/><text x="450" y="245" text-anchor="middle" font-size="14">Identical bonded A–B particles</text><text x="750" y="65" text-anchor="middle" font-size="20">Mixture</text><circle cx="665" cy="110" r="14" fill="#2563eb"/><path d="M665 110 L692 110" stroke="#64748b" stroke-width="2" fill="none"/><circle cx="692" cy="110" r="14" fill="#dc2626"/><circle cx="740" cy="110" r="14" fill="#2563eb"/><circle cx="740" cy="110" r="14" fill="#dc2626"/><circle cx="815" cy="110" r="14" fill="#2563eb"/><path d="M815 110 L842 110" stroke="#64748b" stroke-width="2" fill="none"/><circle cx="842" cy="110" r="14" fill="#dc2626"/><circle cx="665" cy="175" r="14" fill="#2563eb"/><circle cx="665" cy="175" r="14" fill="#dc2626"/><circle cx="740" cy="175" r="14" fill="#2563eb"/><path d="M740 175 L767 175" stroke="#64748b" stroke-width="2" fill="none"/><circle cx="767" cy="175" r="14" fill="#dc2626"/><circle cx="815" cy="175" r="14" fill="#2563eb"/><circle cx="815" cy="175" r="14" fill="#dc2626"/><text x="750" y="245" text-anchor="middle" font-size="14">A–B particles and B atoms</text><text x="450" y="280" text-anchor="middle" font-size="15">Blue = atom A; red = atom B; touching atoms are bonded.</text></g></svg>