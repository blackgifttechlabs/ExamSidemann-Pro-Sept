<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" role="img"><title>Ionic bonding • electrons move from metal to non-metal</title><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a"><text x="450.0" y="30" text-anchor="middle" font-size="22">Ionic bonding • electrons move from metal to non-metal</text><text x="80" y="85" text-anchor="middle" font-size="22">NaCl</text><text x="280" y="85" text-anchor="middle" font-size="17">Na (2,8,1)</text><text x="610" y="85" text-anchor="middle" font-size="17">Cl (2,8,7)</text><path d="M380 80 L495 80" stroke="#64748b" stroke-width="2" fill="none"/><text x="490" y="60" text-anchor="middle" font-size="14">1 electron</text><text x="492" y="87" text-anchor="middle" font-size="24">→</text><text x="450" y="134" text-anchor="middle" font-size="18">Na⁺ (2,8) + Cl⁻ (2,8,8)</text><text x="80" y="220" text-anchor="middle" font-size="22">MgO</text><text x="280" y="220" text-anchor="middle" font-size="17">Mg (2,8,2)</text><text x="610" y="220" text-anchor="middle" font-size="17">O (2,6)</text><path d="M380 215 L495 215" stroke="#64748b" stroke-width="2" fill="none"/><text x="490" y="195" text-anchor="middle" font-size="14">2 electrons</text><text x="492" y="222" text-anchor="middle" font-size="24">→</text><text x="450" y="269" text-anchor="middle" font-size="18">Mg²⁺ (2,8) + O²⁻ (2,8)</text><text x="80" y="355" text-anchor="middle" font-size="22">Na₂O</text><text x="280" y="355" text-anchor="middle" font-size="17">2 Na (each 2,8,1)</text><text x="610" y="355" text-anchor="middle" font-size="17">O (2,6)</text><path d="M380 350 L495 350" stroke="#64748b" stroke-width="2" fill="none"/><text x="490" y="330" text-anchor="middle" font-size="14">1 electron from each Na</text><text x="492" y="357" text-anchor="middle" font-size="24">→</text><text x="450" y="404" text-anchor="middle" font-size="18">2 Na⁺ (each 2,8) + O²⁻ (2,8)</text><text x="450" y="475" text-anchor="middle" font-size="15">Full outer shells form; oppositely charged ions attract in a lattice.</text></g></svg>