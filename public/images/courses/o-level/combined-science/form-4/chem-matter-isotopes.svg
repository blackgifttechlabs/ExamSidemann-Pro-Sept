<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 335" role="img"><title>Isotopes • same element, different neutron counts</title><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a"><text x="450.0" y="30" text-anchor="middle" font-size="22">Isotopes • same element, different neutron counts</text><text x="250" y="70" text-anchor="middle" font-size="20">Carbon-12 (¹²₆C)</text><circle cx="205" cy="110" r="11" fill="#dc2626"/><circle cx="235" cy="110" r="11" fill="#dc2626"/><circle cx="265" cy="110" r="11" fill="#dc2626"/><circle cx="295" cy="110" r="11" fill="#dc2626"/><circle cx="205" cy="138" r="11" fill="#dc2626"/><circle cx="235" cy="138" r="11" fill="#dc2626"/><circle cx="265" cy="138" r="11" fill="#64748b"/><circle cx="295" cy="138" r="11" fill="#64748b"/><circle cx="205" cy="166" r="11" fill="#64748b"/><circle cx="235" cy="166" r="11" fill="#64748b"/><circle cx="265" cy="166" r="11" fill="#64748b"/><circle cx="295" cy="166" r="11" fill="#64748b"/><text x="250" y="238" text-anchor="middle" font-size="16">6 protons + 6 neutrons = mass number 12</text><text x="250" y="270" text-anchor="middle" font-size="15">Neutral atom: 6 electrons (2,4)</text><text x="650" y="70" text-anchor="middle" font-size="20">Carbon-14 (¹⁴₆C)</text><circle cx="605" cy="110" r="11" fill="#dc2626"/><circle cx="635" cy="110" r="11" fill="#dc2626"/><circle cx="665" cy="110" r="11" fill="#dc2626"/><circle cx="695" cy="110" r="11" fill="#dc2626"/><circle cx="605" cy="138" r="11" fill="#dc2626"/><circle cx="635" cy="138" r="11" fill="#dc2626"/><circle cx="665" cy="138" r="11" fill="#64748b"/><circle cx="695" cy="138" r="11" fill="#64748b"/><circle cx="605" cy="166" r="11" fill="#64748b"/><circle cx="635" cy="166" r="11" fill="#64748b"/><circle cx="665" cy="166" r="11" fill="#64748b"/><circle cx="695" cy="166" r="11" fill="#64748b"/><circle cx="605" cy="194" r="11" fill="#64748b"/><circle cx="635" cy="194" r="11" fill="#64748b"/><text x="650" y="238" text-anchor="middle" font-size="16">6 protons + 8 neutrons = mass number 14</text><text x="650" y="270" text-anchor="middle" font-size="15">Neutral atom: 6 electrons (2,4)</text><text x="450" y="310" text-anchor="middle" font-size="15">Red = proton; grey = neutron. Both nuclei contain exactly 6 protons.</text></g></svg>