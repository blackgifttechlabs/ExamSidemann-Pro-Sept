<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
<title id="title">The menstrual cycle: illustrative 28-day timeline</title><desc id="desc">Menstruation begins on day one. Oestrogen supports lining repair before ovulation. After ovulation progesterone maintains the lining. If pregnancy does not occur, hormone levels fall and menstruation starts again.</desc>
<rect width="800" height="430" rx="18" fill="white"/><g font-family="Arial, sans-serif">
<text x="400" y="36" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">The Menstrual Cycle</text>
<text x="400" y="63" text-anchor="middle" font-size="17" fill="#64748b">An example cycle — actual timing varies</text>
<rect x="20" y="85" width="370" height="125" rx="12" fill="#fff1f2" stroke="#be123c" stroke-opacity=".25"/><text x="38" y="115" font-size="22" font-weight="700" fill="#be123c">1. Menstruation</text><text x="38" y="139" font-size="16" fill="#475569">Days 1–5 (example)</text><text x="38" y="168" font-size="18" fill="#334155">Lining is shed.</text><text x="38" y="191" font-size="18" fill="#334155">Day 1 starts the cycle.</text><rect x="410" y="85" width="370" height="125" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-opacity=".25"/><text x="428" y="115" font-size="22" font-weight="700" fill="#1d4ed8">2. Lining repair</text><text x="428" y="139" font-size="16" fill="#475569">Before ovulation</text><text x="428" y="168" font-size="18" fill="#334155">Oestrogen supports</text><text x="428" y="191" font-size="18" fill="#334155">lining growth.</text><rect x="20" y="230" width="370" height="125" rx="12" fill="#fefce8" stroke="#a16207" stroke-opacity=".25"/><text x="38" y="260" font-size="22" font-weight="700" fill="#a16207">3. Ovulation</text><text x="38" y="284" font-size="16" fill="#475569">Around day 14 (example)</text><text x="38" y="313" font-size="18" fill="#334155">An ovum is released</text><text x="38" y="336" font-size="18" fill="#334155">from an ovary.</text><rect x="410" y="230" width="370" height="125" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-opacity=".25"/><text x="428" y="260" font-size="22" font-weight="700" fill="#15803d">4. Lining maintained</text><text x="428" y="284" font-size="16" fill="#475569">After ovulation</text><text x="428" y="313" font-size="18" fill="#334155">Progesterone maintains</text><text x="428" y="336" font-size="18" fill="#334155">the uterine lining.</text><text x="400" y="390" text-anchor="middle" font-size="17" fill="#475569">No pregnancy → hormones fall → next menstruation</text>
</g></svg>