<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" role="img"><title>Reactivity series • read from top to bottom</title><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><g font-family="DejaVu Sans, Arial, sans-serif" fill="#0f172a"><text x="450.0" y="30" text-anchor="middle" font-size="22">Reactivity series • read from top to bottom</text><text x="710" y="90" text-anchor="middle" font-size="19">Most reactive</text><path d="M710 110 L710 540" stroke="#64748b" stroke-width="2" fill="none"/><text x="710" y="555" text-anchor="middle" font-size="19">↓ Least reactive</text><rect x="65" y="65" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="87" text-anchor="middle" font-size="16">Potassium (K)</text><rect x="65" y="104" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="126" text-anchor="middle" font-size="16">Sodium (Na)</text><rect x="65" y="143" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="165" text-anchor="middle" font-size="16">Calcium (Ca)</text><rect x="65" y="182" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="204" text-anchor="middle" font-size="16">Magnesium (Mg)</text><rect x="65" y="221" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="243" text-anchor="middle" font-size="16">Aluminium (Al)</text><rect x="65" y="260" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="282" text-anchor="middle" font-size="16">Zinc (Zn)</text><rect x="65" y="299" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="321" text-anchor="middle" font-size="16">Iron (Fe)</text><rect x="65" y="338" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="360" text-anchor="middle" font-size="16">Tin (Sn)</text><rect x="65" y="377" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="399" text-anchor="middle" font-size="16">Lead (Pb)</text><rect x="65" y="416" width="485" height="33" rx="5" fill="#fef3c7"/><text x="307" y="438" text-anchor="middle" font-size="16">Hydrogen (H) — reference non-metal</text><rect x="65" y="455" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="477" text-anchor="middle" font-size="16">Copper (Cu)</text><rect x="65" y="494" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="516" text-anchor="middle" font-size="16">Silver (Ag)</text><rect x="65" y="533" width="485" height="33" rx="5" fill="#dbeafe"/><text x="307" y="555" text-anchor="middle" font-size="16">Gold (Au)</text><text x="450" y="605" text-anchor="middle" font-size="15">Metals above hydrogen generally release H₂ from suitable dilute acids.</text></g></svg>